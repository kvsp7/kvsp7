<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05050f" />
      <stop offset="50%" stop-color="#0b0c1e" />
      <stop offset="100%" stop-color="#020208" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <!-- Ship Glow -->
    <filter id="ship-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Explosion Filter -->
    <filter id="exp-glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" rx="2" fill="#161b22" />
    </pattern>
  </defs>

  <style>
    @keyframes shipMove {
      0%, 100% { transform: translateX(60px); }
      25% { transform: translateX(280px); }
      50% { transform: translateX(540px); }
      75% { transform: translateX(780px); }
    }
    @keyframes laserShot1 {
      0% { transform: translate(75px, 290px); opacity: 0; }
      10% { opacity: 1; }
      40% { transform: translate(75px, 90px); opacity: 1; }
      41%, 100% { opacity: 0; }
    }
    @keyframes laserShot2 {
      0%, 25% { transform: translate(295px, 290px); opacity: 0; }
      35% { opacity: 1; }
      65% { transform: translate(295px, 90px); opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes laserShot3 {
      0%, 50% { transform: translate(555px, 290px); opacity: 0; }
      60% { opacity: 1; }
      90% { transform: translate(555px, 90px); opacity: 1; }
      91%, 100% { opacity: 0; }
    }
    @keyframes explosion1 {
      0%, 38% { opacity: 0; transform: scale(0.5); }
      42% { opacity: 1; transform: scale(1.4); }
      48%, 100% { opacity: 0; transform: scale(2); }
    }
    @keyframes scoreFloat1 {
      0%, 38% { opacity: 0; transform: translateY(0); }
      43% { opacity: 1; transform: translateY(-15px); }
      55%, 100% { opacity: 0; transform: translateY(-30px); }
    }
    @keyframes stars {
      0% { transform: translateY(0); }
      100% { transform: translateY(380px); }
    }
    .retro-border {
      rx: 12px;
      fill: url(#space-bg);
      stroke: #30363d;
      stroke-width: 2;
    }
    .score-text {
      font-family: 'Press Start 2P', 'Fira Code', monospace;
      font-size: 11px;
      fill: #00f3ff;
      font-weight: bold;
    }
    .ship {
      animation: shipMove 10s infinite ease-in-out;
      filter: url(#ship-glow);
    }
    .laser-1 { animation: laserShot1 10s infinite linear; }
    .laser-2 { animation: laserShot2 10s infinite linear; }
    .laser-3 { animation: laserShot3 10s infinite linear; }
    .exp-1 { animation: explosion1 10s infinite ease-out; transform-origin: 75px 90px; }
    .score-pop { animation: scoreFloat1 10s infinite ease-out; }
  </style>

  <!-- Frame -->
  <rect class="retro-border" width="940" height="370" x="5" y="5" />

  <!-- Top Arcade HUD -->
  <rect width="940" height="35" x="5" y="5" fill="#0d1117" rx="12" />
  <line x1="5" y1="40" x2="945" y2="40" stroke="#30363d" stroke-width="1.5" />

  <text class="score-text" x="25" y="27">SCORE: <tspan fill="#39d353">094,820</tspan></text>
  <text class="score-text" x="380" y="27">🚀 CONTRIBUTION SPACE SHOOTER</text>
  <text class="score-text" x="780" y="27" fill="#ff0055">STAGE 07</text>

  <!-- Contribution Grid (Representing GitHub Activity Matrix) -->
  <g transform="translate(45, 65)">
    <!-- Simulated 52 weeks x 7 days contribution blocks -->
    <!-- Row 1 -->
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#0e4429" />
    <rect x="16" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="32" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="48" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="64" y="0" width="12" height="12" rx="2" fill="#0e4429" />
    <rect x="80" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="96" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="112" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="128" y="0" width="12" height="12" rx="2" fill="#161b22" />
    <rect x="144" y="0" width="12" height="12" rx="2" fill="#0e4429" />
    <rect x="160" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="176" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="192" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="208" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="224" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="240" y="0" width="12" height="12" rx="2" fill="#0e4429" />
    <rect x="256" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="272" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="288" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="304" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="320" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="336" y="0" width="12" height="12" rx="2" fill="#161b22" />
    <rect x="352" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="368" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="384" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="400" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="416" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="432" y="0" width="12" height="12" rx="2" fill="#0e4429" />
    <rect x="448" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="464" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="480" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="496" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="512" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="528" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="544" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="560" y="0" width="12" height="12" rx="2" fill="#0e4429" />
    <rect x="576" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="592" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="608" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="624" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="640" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="656" y="0" width="12" height="12" rx="2" fill="#0e4429" />
    <rect x="672" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="688" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="704" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="720" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="736" y="0" width="12" height="12" rx="2" fill="#0e4429" />
    <rect x="752" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="768" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="784" y="0" width="12" height="12" rx="2" fill="#006d32" />
    <rect x="800" y="0" width="12" height="12" rx="2" fill="#39d353" />
    <rect x="816" y="0" width="12" height="12" rx="2" fill="#26a641" />
    <rect x="832" y="0" width="12" height="12" rx="2" fill="#39d353" />

    <!-- Rows 2 to 7 generated grid -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="844" height="100" fill="url(#grid-pattern)" />
    </g>
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="844" height="80" fill="url(#grid-pattern)" opacity="0.8" />
    </g>
  </g>

  <!-- Laser Beams -->
  <g>
    <rect class="laser-1" width="4" height="40" rx="2" fill="url(#laser-grad)" />
    <rect class="laser-2" width="4" height="40" rx="2" fill="url(#laser-grad)" />
    <rect class="laser-3" width="4" height="40" rx="2" fill="url(#laser-grad)" />
  </g>

  <!-- Explosion Animation FX -->
  <g class="exp-1" filter="url(#exp-glow)">
    <circle cx="75" cy="90" r="14" fill="#ff0055" />
    <circle cx="75" cy="90" r="8" fill="#ffbd2e" />
    <circle cx="75" cy="90" r="4" fill="#ffffff" />
  </g>
  <text class="score-text score-pop" x="65" y="80" fill="#39d353">+500</text>

  <!-- Player Spaceship -->
  <g class="ship" transform="translate(45, 300)">
    <!-- Spaceship Body -->
    <path d="M 15 0 L 25 25 L 30 30 L 0 30 L 5 25 Z" fill="#00f3ff" />
    <path d="M 15 5 L 20 22 L 10 22 Z" fill="#ffffff" />
    <!-- Thruster Flame -->
    <polygon points="12,30 15,40 18,30" fill="#ff0055">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.2s" repeatCount="indefinite" />
    </polygon>
    <!-- Wing Guns -->
    <rect x="-2" y="15" width="4" height="12" rx="1" fill="#bd00ff" />
    <rect x="28" y="15" width="4" height="12" rx="1" fill="#bd00ff" />
  </g>

  <!-- Bottom Instructions Bar -->
  <rect width="940" height="28" x="5" y="347" fill="#090d16" rx="6" />
  <text font-family="'Fira Code', monospace" font-size="11" fill="#64748b" x="25" y="365">
    🎮 <tspan fill="#38bdf8">CONTRIBUTION DEFENDER</tspan> — DESTROY UNCOMMIT BLOCKS &amp; BOOST YOUR STREAK!
  </text>
  <text font-family="'Fira Code', monospace" font-size="11" fill="#10b981" x="800" y="365">
    AUTO-FIRE: ON
  </text>
</svg>
