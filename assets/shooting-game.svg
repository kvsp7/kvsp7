import random

random.seed(42)

colors = [
    '#161b22', '#161b22', '#161b22', '#161b22', # Inactive days (dark grey)
    '#0e4429', # Low activity (dark green)
    '#006d32', # Medium-low activity (mid green)
    '#26a641', # Medium-high activity (light green)
    '#39d353'  # High activity (bright green)
]

rects = []
for c in range(52):
    for r in range(7):
        x = c * 16
        y = r * 16
        col = random.choice(colors)
        border = '#21262d' if col == '#161b22' else '#30363d'
        rects.append(f'<rect x="{x}" y="{y}" width="12" height="12" rx="2" fill="{col}" stroke="{border}" stroke-width="0.8" />')

grid_svg = "\n    ".join(rects)

svg_content = f"""<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05050f" />
      <stop offset="50%" stop-color="#0b0c1e" />
      <stop offset="100%" stop-color="#020208" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <!-- Ship Glow -->
    <filter id="ship-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Explosion Filter -->
    <filter id="exp-glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes shipMove {{
      0%, 100% {{ transform: translateX(60px); }}
      25% {{ transform: translateX(280px); }}
      50% {{ transform: translateX(540px); }}
      75% {{ transform: translateX(780px); }}
    }}
    @keyframes laserShot1 {{
      0% {{ transform: translate(75px, 290px); opacity: 0; }}
      10% {{ opacity: 1; }}
      40% {{ transform: translate(75px, 140px); opacity: 1; }}
      41%, 100% {{ opacity: 0; }}
    }}
    @keyframes laserShot2 {{
      0%, 25% {{ transform: translate(295px, 290px); opacity: 0; }}
      35% {{ opacity: 1; }}
      65% {{ transform: translate(295px, 110px); opacity: 1; }}
      66%, 100% {{ opacity: 0; }}
    }}
    @keyframes laserShot3 {{
      0%, 50% {{ transform: translate(555px, 290px); opacity: 0; }}
      60% {{ opacity: 1; }}
      90% {{ transform: translate(555px, 90px); opacity: 1; }}
      91%, 100% {{ opacity: 0; }}
    }}
    @keyframes explosion1 {{
      0%, 38% {{ opacity: 0; transform: scale(0.5); }}
      42% {{ opacity: 1; transform: scale(1.4); }}
      48%, 100% {{ opacity: 0; transform: scale(2); }}
    }}
    @keyframes scoreFloat1 {{
      0%, 38% {{ opacity: 0; transform: translateY(0); }}
      43% {{ opacity: 1; transform: translateY(-15px); }}
      55%, 100% {{ opacity: 0; transform: translateY(-30px); }}
    }}
    .retro-border {{
      rx: 12px;
      fill: url(#space-bg);
      stroke: #30363d;
      stroke-width: 2;
    }}
    .score-text {{
      font-family: 'Press Start 2P', 'Fira Code', monospace;
      font-size: 11px;
      fill: #00f3ff;
      font-weight: bold;
    }}
    .ship {{
      animation: shipMove 10s infinite ease-in-out;
      filter: url(#ship-glow);
    }}
    .laser-1 {{ animation: laserShot1 10s infinite linear; }}
    .laser-2 {{ animation: laserShot2 10s infinite linear; }}
    .laser-3 {{ animation: laserShot3 10s infinite linear; }}
    .exp-1 {{ animation: explosion1 10s infinite ease-out; transform-origin: 75px 140px; }}
    .score-pop {{ animation: scoreFloat1 10s infinite ease-out; }}
    .legend-text {{
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      fill: #8b949e;
    }}
  </style>

  <!-- Frame -->
  <rect class="retro-border" width="940" height="370" x="5" y="5" />

  <!-- Top Arcade HUD -->
  <rect width="940" height="35" x="5" y="5" fill="#0d1117" rx="12" />
  <line x1="5" y1="40" x2="945" y2="40" stroke="#30363d" stroke-width="1.5" />

  <text class="score-text" x="25" y="27">SCORE: <tspan fill="#39d353">094,820</tspan></text>
  <text class="score-text" x="350" y="27">🚀 CONTRIBUTION SPACE SHOOTER</text>
  <text class="score-text" x="780" y="27" fill="#ff0055">STAGE 07</text>

  <!-- Contribution Grid Matrix (52 weeks x 7 days: Active Green & Inactive Dark Blocks) -->
  <g transform="translate(55, 65)">
    {grid_svg}
  </g>

  <!-- Laser Beams -->
  <g>
    <rect class="laser-1" width="4" height="40" rx="2" fill="url(#laser-grad)" />
    <rect class="laser-2" width="4" height="40" rx="2" fill="url(#laser-grad)" />
    <rect class="laser-3" width="4" height="40" rx="2" fill="url(#laser-grad)" />
  </g>

  <!-- Explosion Animation FX -->
  <g class="exp-1" filter="url(#exp-glow)">
    <circle cx="75" cy="140" r="14" fill="#ff0055" />
    <circle cx="75" cy="140" r="8" fill="#ffbd2e" />
    <circle cx="75" cy="140" r="4" fill="#ffffff" />
  </g>
  <text class="score-text score-pop" x="65" y="130" fill="#39d353">+500</text>

  <!-- Player Spaceship -->
  <g class="ship" transform="translate(45, 300)">
    <!-- Spaceship Body -->
    <path d="M 15 0 L 25 25 L 30 30 L 0 30 L 5 25 Z" fill="#00f3ff" />
    <path d="M 15 5 L 20 22 L 10 22 Z" fill="#ffffff" />
    <!-- Thruster Flame -->
    <polygon points="12,30 15,40 18,30" fill="#ff0055">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.2s" repeatCount="indefinite" />
    </polygon>
    <!-- Wing Guns -->
    <rect x="-2" y="15" width="4" height="12" rx="1" fill="#bd00ff" />
    <rect x="28" y="15" width="4" height="12" rx="1" fill="#bd00ff" />
  </g>

  <!-- Bottom Legend & Controls Bar -->
  <rect width="940" height="28" x="5" y="347" fill="#090d16" rx="6" />
  <g transform="translate(25, 365)">
    <text class="legend-text" x="0" y="0">Less</text>
    <rect x="35" y="-9" width="10" height="10" rx="2" fill="#161b22" stroke="#21262d" />
    <rect x="48" y="-9" width="10" height="10" rx="2" fill="#0e4429" stroke="#30363d" />
    <rect x="61" y="-9" width="10" height="10" rx="2" fill="#006d32" stroke="#30363d" />
    <rect x="74" y="-9" width="10" height="10" rx="2" fill="#26a641" stroke="#30363d" />
    <rect x="87" y="-9" width="10" height="10" rx="2" fill="#39d353" stroke="#30363d" />
    <text class="legend-text" x="103" y="0">More (Inactive Dark + Active Green Blocks)</text>
  </g>
  <text font-family="'Fira Code', monospace" font-size="11" fill="#10b981" x="800" y="365">
    AUTO-FIRE: ON
  </text>
</svg>
"""

with open(r"d:\Antigravity\kvsp7\assets\shooting-game.svg", "w") as f:
    f.write(svg_content)

print("Updated shooting-game.svg successfully!")
