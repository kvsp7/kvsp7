<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560">
  <!-- Background -->
  <rect width="460" height="560" rx="16" fill="#f8fafc"/>
  <defs>
    <pattern id="tgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect width="460" height="560" rx="16" fill="url(#tgrid)" opacity="0.3"/>

  <!-- Title -->
  <text x="230" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8" letter-spacing="3" font-weight="600">TRANSFORMER ARCHITECTURE</text>

  <!-- ─── ANIMATED ARROW PATHS ─── -->
  <path id="a1" d="M230,80 L230,108" fill="none"/>
  <path id="a2" d="M230,158 L230,186" fill="none"/>
  <path id="a3" d="M130,240 L170,270" fill="none"/>
  <path id="a4" d="M230,240 L230,270" fill="none"/>
  <path id="a5" d="M330,240 L290,270" fill="none"/>
  <path id="a6" d="M230,318 L230,346" fill="none"/>
  <path id="a7" d="M230,396 L230,424" fill="none"/>
  <path id="a8" d="M230,474 L230,502" fill="none"/>

  <!-- ─── BOXES ─── -->
  <!-- 1. Tokens -->
  <rect x="140" y="42" width="180" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" opacity="0.95">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="230" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="600">Tokens</text>

  <!-- Arrow 1 -->
  <line x1="230" y1="80" x2="230" y2="108" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="226,105 230,113 234,105" fill="#94a3b8"/>
  <circle r="3" fill="#2563eb" opacity="0">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="0s"><mpath href="#a1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.5s" repeatCount="indefinite" begin="0s"/>
  </circle>

  <!-- 2. Embeddings + Positional Encoding -->
  <rect x="95" y="115" width="270" height="42" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" opacity="0.95">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <text x="230" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1e293b" font-weight="600">Embeddings</text>
  <text x="230" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">+ Positional Encoding</text>

  <!-- Arrow 2 -->
  <line x1="230" y1="157" x2="230" y2="188" stroke="#94a3b8" stroke-width="1.2"/>
  <circle r="3" fill="#2563eb" opacity="0">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="0.5s"><mpath href="#a2"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- 3. Q, K, V boxes (side by side) -->
  <rect x="70" y="195" width="80" height="46" rx="8" fill="#ecfdf5" stroke="#06b6d4" stroke-width="1.5">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" begin="1s"/>
  </rect>
  <text x="110" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#06b6d4" font-weight="700">Q</text>
  <text x="110" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">Query</text>

  <rect x="190" y="195" width="80" height="46" rx="8" fill="#ecfdf5" stroke="#06b6d4" stroke-width="1.5">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" begin="1.3s"/>
  </rect>
  <text x="230" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#06b6d4" font-weight="700">K</text>
  <text x="230" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">Key</text>

  <rect x="310" y="195" width="80" height="46" rx="8" fill="#ecfdf5" stroke="#06b6d4" stroke-width="1.5">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" begin="1.6s"/>
  </rect>
  <text x="350" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#06b6d4" font-weight="700">V</text>
  <text x="350" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">Value</text>

  <!-- Split arrows from Embeddings to Q/K/V -->
  <line x1="170" y1="157" x2="110" y2="195" stroke="#94a3b8" stroke-width="1"/>
  <line x1="230" y1="157" x2="230" y2="195" stroke="#94a3b8" stroke-width="1"/>
  <line x1="290" y1="157" x2="350" y2="195" stroke="#94a3b8" stroke-width="1"/>

  <!-- Converging arrows from Q/K/V to Attention -->
  <line x1="110" y1="241" x2="180" y2="280" stroke="#94a3b8" stroke-width="1"/>
  <line x1="230" y1="241" x2="230" y2="280" stroke="#94a3b8" stroke-width="1"/>
  <line x1="350" y1="241" x2="280" y2="280" stroke="#94a3b8" stroke-width="1"/>

  <!-- Particles Q→Attn, K→Attn, V→Attn -->
  <circle r="3" fill="#06b6d4" opacity="0">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.5s"><mpath href="#a3"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle r="3" fill="#06b6d4" opacity="0">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.8s"><mpath href="#a4"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="1.8s"/>
  </circle>
  <circle r="3" fill="#06b6d4" opacity="0">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="2.1s"><mpath href="#a5"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" repeatCount="indefinite" begin="2.1s"/>
  </circle>

  <!-- 4. Scaled Dot-Product Attention -->
  <rect x="95" y="280" width="270" height="38" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" begin="2s"/>
  </rect>
  <text x="230" y="299" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7c3aed" font-weight="700">softmax( QKᵀ / √dₖ ) · V</text>
  <text x="230" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#a78bfa">Scaled Dot-Product Attention</text>

  <!-- Arrow 6 -->
  <line x1="230" y1="318" x2="230" y2="350" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="226,347 230,355 234,347" fill="#94a3b8"/>
  <circle r="3" fill="#7c3aed" opacity="0">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="2.5s"><mpath href="#a6"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.5s" repeatCount="indefinite" begin="2.5s"/>
  </circle>

  <!-- 5. Feed Forward Network -->
  <rect x="120" y="358" width="220" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" begin="2.5s"/>
  </rect>
  <text x="230" y="382" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1e293b" font-weight="600">Feed Forward Network</text>

  <!-- Arrow 7 -->
  <line x1="230" y1="396" x2="230" y2="428" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="226,425 230,433 234,425" fill="#94a3b8"/>
  <circle r="3" fill="#2563eb" opacity="0">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="3s"><mpath href="#a7"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.5s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- 6. Layer Norm -->
  <rect x="140" y="436" width="180" height="38" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" begin="3s"/>
  </rect>
  <text x="230" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1e293b" font-weight="600">Layer Normalization</text>

  <!-- Arrow 8 -->
  <line x1="230" y1="474" x2="230" y2="506" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="226,503 230,511 234,503" fill="#94a3b8"/>
  <circle r="3" fill="#10b981" opacity="0">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="3.5s"><mpath href="#a8"/></animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.5s" repeatCount="indefinite" begin="3.5s"/>
  </circle>

  <!-- 7. Output -->
  <rect x="140" y="510" width="180" height="38" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" begin="3.5s"/>
  </rect>
  <text x="230" y="534" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#10b981" font-weight="700">Output</text>

  <!-- Residual connection (skip arc on the right side) -->
  <path d="M370,157 C420,157 420,286 370,286" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="425" y="222" font-family="system-ui,sans-serif" font-size="8" fill="#94a3b8" font-style="italic">residual</text>
</svg>
