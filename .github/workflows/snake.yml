name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kvsp7
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2306B6D4&color_dots=%23E2E8F0%2C%23BAE6FD%2C%2367E8F9%2C%2322D3EE%2C%2306B6D4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2306B6D4

      - name: Publish contribution animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
